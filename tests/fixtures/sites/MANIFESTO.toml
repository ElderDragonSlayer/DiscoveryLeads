viewport_presente = true                     # <meta name=viewport ...> SEM aspas
meta_description_presente = false
rastreamento = []
nota = """
Resposta do spike S4.

Detalhe que custou uma correcao: a pagina declara o viewport como
`<meta name=viewport content="...">`, com o atributo `name` SEM aspas. Extracao
por grep que procure `name="viewport"` responde "sem viewport" e inventa um
defeito vendavel que nao existe. Parser de arvore nao se importa com aspas. O corpo e o 404 generico do Google, com ZERO informacao
identificadora: nao ha assinatura de HTML possivel. A regra tem que ser de
dominio, e tem que ter precedencia sobre `quebrado`, senao um lead T1
(GOOGLE_SITES_EXTINTO) e rebaixado para SITE_QUEBRADO, que nem faixa T1 tem.
Detalhe completo em docs/superpowers/specs/2026-09-10-spike-s4-e-armadilhas.md
"""

