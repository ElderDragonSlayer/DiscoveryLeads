nota = """
NAO E PAGINA COLHIDA. E a fixture real com UM campo trocado:

    "facebookPixelId":null  ->  "facebookPixelId":"100000000000001"

Treze bytes de diferenca, um unico diff. O `metaPixelConsentId` da Linktree fica
intocado de proposito, para que esta fixture prove as duas coisas ao mesmo tempo:
o pixel do lojista e detectado E o consentId continua sendo ignorado.

Existe porque o caso maximo T0 da secao 6.2 — Pixel dentro de um agregador — nao
foi encontrado em nenhuma pagina publica. Na Linktree o pixel exige plano pago, o
que ja e um dado sobre o tamanho esperado da faixa T0. Sem esta fixture, a
maneira preguicosa de fugir da armadilha 1 (devolver sempre False para agregador)
passaria em todos os testes.
"""

