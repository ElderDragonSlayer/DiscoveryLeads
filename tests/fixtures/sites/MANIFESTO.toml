# Manifesto das fixtures de site
#
# Cada entrada e um caso real, baixado com curl e User-Agent de navegador, sem
# JavaScript — exatamente o que o coletor vai enxergar em producao.
#
# Este arquivo e a especificacao do `site_classifier` em forma de dado: a coluna
# `plataforma_esperada` e o resultado que o teste exige, e `assinatura` e a prova
# de por que aquele resultado esta certo. Nenhuma expectativa aqui foi suposta —
# todas sairam de inspecao do HTML baixado.
#
# Regravar uma fixture: refazer o curl, conferir http_status/redirects, e
# atualizar a entrada. Fixture que muda sem o manifesto mudar e teste mentindo.

