# ────────────────────────────── lacunas ──────────────────────────────
#
# Casos que a secao 12 da spec pede e este conjunto ainda nao cobre:
#
#   - `quebrado` por DNS: nao vira fixture de HTML, e comportamento do fetcher.
#     Verificado ao vivo: salao-que-nao-existe-xyz9271.com.br e
#     www.neuroaplicativos.com.br -> "Could not resolve host" -> motivo
#     `dominio_nao_resolve`. Testar com transporte falso, sem rede.
#   - redirecionamento triplo: idem, comportamento do fetcher. Observado ao vivo
#     em https://negocio.site/ (3 saltos ate business.google.com).
#   - `ausente`: e a ausencia de websiteUri no Places, nao existe HTML.
#   - Google Ads (AW-): NENHUMA das 13 fixtures tem. O detector de `AW-` vai
#     nascer sem caso positivo real. Lacuna conhecida — e o sinal de maior peso
#     da faixa T0, entao merece uma fixture assim que aparecer uma na busca real.
#   - heatmap (hotjar/clarity) e TikTok Pixel: idem, sem caso positivo real.
#   - Pixel DENTRO de Canva ou Linktree — o caso maximo T0 da secao 6.2. Nenhuma
#     das 5 paginas de Canva/Linktree inspecionadas tinha. E raro por construcao
#     (exige plano pago da Linktree), o que ja e um dado sobre o tamanho de T0.
